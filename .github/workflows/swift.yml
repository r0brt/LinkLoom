name: Swift

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Swift / test
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Test
        run: swift test
      - name: 10,000-document acceptance
        env:
          LINKLOOM_PERF_TEST: "1"
        run: swift test --filter catalogHandlesTenThousandDocumentsIdempotently

  release-build:
    name: Swift / release-build
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Release build
        run: swift build -c release

  ui-smoke:
    name: Swift / UI smoke
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Process-level UI smoke
        run: |
          xcodebuild test \
            -project LinkLoom.xcodeproj \
            -scheme LinkLoomUISmoke \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/LinkLoomDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/LinkLoomUISmoke.xcresult"
      - name: Upload UI smoke result bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LinkLoomUISmoke-xcresult
          path: ${{ runner.temp }}/LinkLoomUISmoke.xcresult
          retention-days: 7
          if-no-files-found: warn
